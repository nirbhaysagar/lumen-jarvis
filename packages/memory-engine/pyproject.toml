[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumen-memory"
version = "0.1.0"
description = "Verifiable, local-first cited memory engine for Lumen"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "alembic>=1.13.0",
    "jsonschema>=4.20.0",
    "rapidfuzz>=3.6.0",
    "dateparser>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "mcp>=2.0.0",             # MIT (official Model Context Protocol SDK)
    "pypdf>=4.0.0",           # BSD-3-Clause
    "markdown-it-py>=3.0.0",  # MIT
    "beautifulsoup4>=4.12.0", # MIT
    "openpyxl>=3.1.0",        # MIT
    "cryptography>=42.0.0",   # Apache-2.0 / BSD
]

[project.optional-dependencies]
web = [
    "youtube-transcript-api>=0.6.0", # MIT
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pip-licenses>=4.3.0",
]

[project.scripts]
lumen-memory = "app.main:cli"
lumen-memory-mcp = "app.mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
